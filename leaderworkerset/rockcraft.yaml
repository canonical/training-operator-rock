# Source https://github.com/kubernetes-sigs/lws/blob/v0.7.0/Dockerfile
name: leaderworkerset
summary: An image for LeaderWorkerSet
description: |
  LeaderWorkerSet: An API for deploying a group of pods as a unit of replication.
  It aims to address common deployment patterns of AI/ML inference workloads,
  especially multi-host inference workloads where the LLM will be sharded and run across multiple devices on multiple nodes.
version: "0.7.0"
license: Apache-2.0
base: ubuntu@22.04

platforms:
  amd64:

services:
  leaderworkerset:
    override: merge
    command: "/manager"
    startup: enabled

run-user: _daemon_

parts:
  security-team-requirement:
    plugin: nil
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/usr/share/rocks
      (echo "# os-release" && cat /etc/os-release && echo "# dpkg-query" && \
       dpkg-query -f '${db:Status-Abbrev},${binary:Package},${Version},${source:Package},${Source:Version}\n' -W) > \
       ${CRAFT_PART_INSTALL}/usr/share/rocks/dpkg.query

  leaderworkerset:
    plugin: go
    build-snaps:
      - go/1.24/stable
    source: https://github.com/kubernetes-sigs/lws
    source-type: git
    source-tag: v0.7.0
    source-depth: 1
    build-environment:
      - CGO_ENABLED: 0
      - GOOS: linux
    override-build: |
      cd $CRAFT_PART_SRC
      make build GO_BUILD_ENV='CGO_ENABLED=${CGO_ENABLED} GOOS=${GOOS}'
      cp bin/manager $CRAFT_PART_INSTALL
